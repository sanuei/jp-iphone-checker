<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan iPhone Network Restriction Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0077ed;
        }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        #result {
            margin-top: 1.5rem;
            text-align: left;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .status-O { color: green; font-weight: bold; }
        .status-X { color: red; font-weight: bold; }
        .status-triangle { color: orange; font-weight: bold; } /* Triangle */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0071e3;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>iPhone Network Check</h1>
        <input type="text" id="imei" placeholder="Enter IMEI (15 digits)" maxlength="15">
        <button id="checkBtn" onclick="checkIMEI()">Check Now</button>
        <div class="loader" id="loader"></div>
        <div id="result"></div>
    </div>

    <script>
        async function checkIMEI() {
            const imei = document.getElementById('imei').value;
            if (!imei || imei.length < 15) {
                alert("Please enter a valid 15-digit IMEI.");
                return;
            }

            const btn = document.getElementById('checkBtn');
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('result');

            btn.disabled = true;
            loader.style.display = 'block';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch(`/api/check?imei=${imei}`);
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<p style="color:red">Error: ${data.error}</p>`;
                } else {
                    let html = '';
                    data.results.forEach(r => {
                        let statusClass = '';
                        if (r.status === 'O') statusClass = 'status-O';
                        else if (r.status === 'X') statusClass = 'status-X';
                        else if (r.status === '△') statusClass = 'status-triangle';

                        html += `
                            <div class="result-item">
                                <span>${r.carrier}</span>
                                <span class="${statusClass}">${r.status}</span>
                            </div>
                        `;
                    });
                    resultDiv.innerHTML = html;
                }
            } catch (e) {
                resultDiv.innerHTML = `<p style="color:red">Network Error</p>`;
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
